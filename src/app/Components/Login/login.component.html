<div class="login-page" role="main">
  <div class="bg" aria-hidden="true"></div>
  <div class="bg-overlay" aria-hidden="true"></div>

  <section class="card" aria-label="Formulario de inicio de sesión">
    <header class="header">
      <h1 class="title">Bienvenido</h1>
      <p class="subtitle">Inicia sesión para continuar</p>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <!-- CORREO -->
      <div class="field">
        <label for="correoElectronico">Correo electrónico</label>
        <input
          type="email"
          id="correoElectronico"
          formControlName="correoElectronico"
          placeholder="correo@ejemplo.com"
          [attr.aria-invalid]="form.get('correoElectronico')?.invalid && (form.get('correoElectronico')?.dirty || form.get('correoElectronico')?.touched)"
        />

        <p class="error"
           *ngIf="form.get('correoElectronico')?.invalid && (form.get('correoElectronico')?.dirty || form.get('correoElectronico')?.touched)">

          <span *ngIf="form.get('correoElectronico')?.errors?.['required']">
            El correo es obligatorio
          </span>

          <span *ngIf="form.get('correoElectronico')?.errors?.['email']">
            Correo inválido
          </span>

        </p>
      </div>

      <!-- CONTRASEÑA -->
      <div class="field">
        <label for="contraseña">Contraseña</label>

        <div>
          <input
            [type]="showPassword() ? 'text' : 'password'"
            id="contraseña"
            formControlName="contraseña"
            placeholder="********"
            [attr.aria-invalid]="form.get('contraseña')?.invalid && (form.get('contraseña')?.dirty || form.get('contraseña')?.touched)"
          />

          <button type="button" (click)="togglePasswordVisibility()">
            {{ showPassword() ? 'Ocultar' : 'Ver' }}
          </button>
        </div>

        <p class="error"
           *ngIf="form.get('contraseña')?.invalid && (form.get('contraseña')?.dirty || form.get('contraseña')?.touched)">

          <span *ngIf="form.get('contraseña')?.errors?.['required']">
            La contraseña es obligatoria
          </span>

          <span *ngIf="form.get('contraseña')?.errors?.['minlength']">
            Mínimo 8 caracteres
          </span>

        </p>
      </div>

      <!-- RECORDAR -->
      <div>
        <label>
          <input type="checkbox" formControlName="rememberMe" />
          Recordarme
        </label>
      </div>

      <!-- BOTÓN -->
      <button type="submit" [disabled]="!canSubmit()">
        Iniciar sesión
      </button>

    </form>
  </section>
</div>
