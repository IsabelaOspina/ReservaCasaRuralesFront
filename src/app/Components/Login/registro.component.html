<div class="registro-container">
  <div class="registro-card">
    <div class="registro-header">
      <h2>Crear Cuenta</h2>
      <p>Regístrate para comenzar a usar nuestros servicios</p>
    </div>

    <!-- Mensajes de éxito y error -->
    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>
    
    <div *ngIf="errorMessage" class="alert alert-error">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" #registroForm="ngForm">
      <!-- Campo: Nombre -->
      <div class="form-group">
        <label for="nombre">Nombre Completo *</label>
        <div class="input-group">
          <span class="input-icon">👤</span>
          <input 
            type="text" 
            id="nombre"
            [(ngModel)]="registroData.nombre"
            name="nombre"
            class="form-control"
            placeholder="Ingresa tu nombre completo"
            required
            [disabled]="loading">
        </div>
      </div>

      <!-- Campo: Usuario -->
      <div class="form-group">
        <label for="usuario">Nombre de Usuario *</label>
        <div class="input-group">
          <span class="input-icon">@</span>
          <input 
            type="text" 
            id="usuario"
            [(ngModel)]="registroData.usuario"
            name="usuario"
            class="form-control"
            placeholder="El nombre que usarás para iniciar sesión"
            required
            minlength="3"
            [disabled]="loading">
        </div>
        <small class="form-text">Mínimo 3 caracteres</small>
      </div>

      <!-- Campo: Contraseña -->
      <div class="form-group">
        <label for="contraseña">Contraseña *</label>
        <div class="input-group">
          <span class="input-icon">🔒</span>
          <input 
            [type]="showPassword ? 'text' : 'password'"
            id="contraseña"
            [(ngModel)]="registroData.password"
            name="contraseña"
            class="form-control"
            placeholder="Crea una contraseña segura"
            required
            minlength="6"
            [disabled]="loading">
          <button 
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()">
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
        <small class="form-text">Mínimo 6 caracteres</small>
      </div>

      <!-- Campo: Correo Electrónico -->
      <div class="form-group">
        <label for="correoElectronico">Correo Electrónico *</label>
        <div class="input-group">
          <span class="input-icon">📧</span>
          <input 
            type="email" 
            id="correoElectronico"
            [(ngModel)]="registroData.correoElectronico"
            name="correoElectronico"
            class="form-control"
            placeholder="tu@email.com"
            required
            email
            [disabled]="loading">
        </div>
      </div>

      <!-- Campo: Teléfono de Contacto -->
      <div class="form-group">
        <label for="telefonoContacto">Teléfono de Contacto *</label>
        <div class="input-group">
          <span class="input-icon">📱</span>
          <input 
            type="tel" 
            id="telefonoContacto"
            [(ngModel)]="registroData.telefonoContacto"
            name="telefonoContacto"
            class="form-control"
            placeholder="123456789"
            required
            pattern="[0-9]{8,15}"
            [disabled]="loading">
        </div>
        <small class="form-text">Solo números, entre 8 y 15 dígitos</small>
      </div>

      <!-- Campo: Número de Cuenta -->
      <div class="form-group">
        <label for="numeroCuenta">Número de Cuenta *</label>
        <div class="input-group">
          <span class="input-icon">🏦</span>
          <input 
            type="text" 
            id="numeroCuenta"
            [(ngModel)]="registroData.numeroCuenta"
            name="numeroCuenta"
            class="form-control"
            placeholder="Número de cuenta bancaria"
            required
            [disabled]="loading">
        </div>
      </div>

      <!-- Botones de acción -->
      <div class="form-actions">
        <button 
          type="submit" 
          class="btn btn-primary"
          [disabled]="loading || registroForm.invalid">
          <span *ngIf="loading" class="spinner"></span>
          {{ loading ? 'Registrando...' : 'Registrarse' }}
        </button>
        
        <button 
          type="button" 
          class="btn btn-secondary"
          (click)="resetFormulario()"
          [disabled]="loading">
          Limpiar
        </button>
      </div>

      <!-- Enlace para ir al login -->
      <div class="login-link">
        ¿Ya tienes cuenta? 
        <a href="javascript:void(0)" (click)="irAlLogin()" class="link">
          Inicia sesión aquí
        </a>
      </div>
    </form>
  </div>
</div>
